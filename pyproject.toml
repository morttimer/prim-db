[project]
name = "prim-db"
version = "0.1.0"
description = "Primitive db CLI application"
readme = "README.md"
authors = [
    { name = "kbobkov", email = "godmortt@yandex.ru" }
]
requires-python = ">=3.12"

[project.scripts]
prim-db = "prim_db.main:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

